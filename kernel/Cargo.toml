[package]
name = "ruxos"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A small Linux-ABI-compatible kernel for AArch64 and RISC-V, enough to run ruwebos"

[[bin]]
name = "ruxos"
path = "src/main.rs"
test = false
bench = false

[dependencies]
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
